# ─────────────────────────────────────────────────────────────────────────────
# HTTP config. HTTPS block kept commented at the BOTTOM (sibling, NOT nested).
# When enabling TLS: replace `yourdomain.com`, uncomment the two servers below,
# and turn THIS block into a 301 redirect (or delete it). See root README certbot flow.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/crud-market/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        # SPA fallback: connect to base index.html file when target url has not rendered or fetched
    }

    # --- Reverse proxy to API Endpoint ---
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --- Reverse proxy to server log endpoint---
    location = /log {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

